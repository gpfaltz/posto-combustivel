# Configuração da URL de conexão ao banco H2. 
# Usa um arquivo local em ./data/posto e mantém o banco aberto entre execuções.
spring.datasource.url=jdbc:h2:file:./data/posto;DB_CLOSE_DELAY=-1
# Driver JDBC do H2.
spring.datasource.driverClassName=org.h2.Driver
# Estratégia de criação/atualização do schema JPA. "update" sincroniza o modelo com o banco sem perder dados.
spring.jpa.hibernate.ddl-auto=update
# Habilita o console web do H2 para inspeção do banco.
spring.h2.console.enabled=true
# Define o caminho de acesso ao console H2.
spring.h2.console.path=/h2-console